<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -720 580 370" width="1160" height="740" style="background:#fff;font-family:Arial,Helvetica,sans-serif;">
    <style>text{paint-order:stroke;stroke:#fff;stroke-width:2.5px;stroke-linejoin:round;}</style>


    <!-- Stand-in shower: m46-m47-m48-m49 (3' x 5'), open entry on the m46-m49 side -->
    <defs>
        <pattern id="tile" width="6" height="6" patternUnits="userSpaceOnUse">
            <rect width="6" height="6" fill="#e3f2fd"/>
            <path d="M0 6 L6 0" stroke="#90caf9" stroke-width="0.6"/>
        </pattern>
    </defs>

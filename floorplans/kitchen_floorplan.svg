<?xml version="1.0" encoding="UTF-8"?>
<!-- Kitchen floor plan. Scale: 100 px = 1 m (1:50 at 2 px/mm). Interior 7.20 x 4.80 m. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 740" width="960" height="740" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="wood" width="100" height="12" patternUnits="userSpaceOnUse">
      <rect width="100" height="12" fill="#f6efe4"/>
      <line x1="0" y1="12" x2="100" y2="12" stroke="#eadfcd" stroke-width="1"/>
    </pattern>
    <pattern id="rug" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#ece8f0"/>
      <circle cx="4" cy="4" r="0.8" fill="#d6cfdd"/>
    </pattern>
    <marker id="tick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <line x1="2" y1="8" x2="8" y2="2" stroke="#555" stroke-width="1.5"/>
    </marker>
    <style>
      .label { font-size: 13px; fill: #333; letter-spacing: 1.5px; font-weight: 600; }
      .small { font-size: 10px; fill: #555; }
      .dim { font-size: 11px; fill: #555; }
      .dimline { stroke: #777; stroke-width: 1; marker-start: url(#tick); marker-end: url(#tick); }
      .ext { stroke: #aaa; stroke-width: 0.75; }
      .furn { fill: #fff; stroke: #444; stroke-width: 1.25; }
      .counter { fill: #fbfaf7; stroke: #333; stroke-width: 1.5; }
      .oak { fill: #e9d3b0; stroke: #8a6a3d; stroke-width: 1.25; }
    </style>
  </defs>

  <rect width="960" height="740" fill="#ffffff"/>
  <text x="80" y="32" font-size="20" font-weight="700" fill="#222">Kitchen &amp; Living — Floor Plan</text>
  <text x="80" y="50" class="small">Open-plan oak &amp; marble island kitchen · scale 1:50 · dimensions in metres</text>

  <g transform="translate(20,50)">
    <!-- Floor -->
    <rect x="80" y="90" width="720" height="480" fill="url(#wood)"/>

    <!-- Zone divider -->
    <line x1="380" y1="90" x2="380" y2="570" stroke="#c9b9a0" stroke-width="1" stroke-dasharray="6 6"/>

    <!-- ===== LIVING ===== -->
    <rect x="110" y="225" width="240" height="290" fill="url(#rug)" stroke="#bfb5c9" stroke-width="1"/>
    <!-- Sofa facing east -->
    <g class="furn">
      <rect x="100" y="250" width="90" height="230" rx="8"/>
      <rect x="100" y="250" width="28" height="230" rx="6"/>
      <rect x="128" y="250" width="62" height="22" rx="5"/>
      <rect x="128" y="458" width="62" height="22" rx="5"/>
      <line x1="128" y1="348" x2="190" y2="348"/>
      <line x1="128" y1="383" x2="190" y2="383" stroke-opacity="0"/>
    </g>
    <rect x="235" y="320" width="70" height="90" rx="4" class="oak"/>
    <!-- Plant -->
    <circle cx="112" cy="122" r="16" fill="#cfe3c4" stroke="#6b8f5a"/>
    <circle cx="112" cy="122" r="7" fill="#b98a5e" stroke="#7d5a38"/>
    <!-- Curtain -->
    <path d="M 94 96 q 4 6 0 12 q -4 6 0 12 q 4 6 0 12 q -4 6 0 12" fill="none" stroke="#b9ae9c" stroke-width="2"/>
    <text x="230" y="545" class="label" text-anchor="middle">LIVING</text>

    <!-- ===== KITCHEN ===== -->
    <!-- Base cabinet run, east wall (0.65 m deep) -->
    <rect x="735" y="150" width="65" height="350" class="counter"/>
    <!-- Oak drawer fronts hint -->
    <line x1="735" y1="150" x2="735" y2="500" stroke="#8a6a3d" stroke-width="3"/>
    <!-- Upper open shelving (dashed, above) -->
    <text x="725" y="466" class="small" text-anchor="end">Dishwasher</text>
    <text x="725" y="479" class="small" text-anchor="end">walnut shelves above</text>

    <!-- Tall pantry (north end) -->
    <rect x="735" y="90" width="65" height="60" fill="#f1ede6" stroke="#333" stroke-width="1.5"/>
    <line x1="735" y1="90" x2="800" y2="150" stroke="#888"/>
    <line x1="800" y1="90" x2="735" y2="150" stroke="#888"/>
    <text x="767" y="167" class="small" text-anchor="middle">TALL</text>

    <!-- Cooktop -->
    <rect x="745" y="215" width="48" height="72" rx="3" fill="#e9e9e9" stroke="#333"/>
    <circle cx="759" cy="234" r="8" fill="none" stroke="#333"/>
    <circle cx="779" cy="234" r="6" fill="none" stroke="#333"/>
    <circle cx="759" cy="268" r="6" fill="none" stroke="#333"/>
    <circle cx="779" cy="268" r="8" fill="none" stroke="#333"/>
    <text x="725" y="256" class="small" text-anchor="end">Cooktop</text>
    <text x="725" y="269" class="small" text-anchor="end">oven below</text>

    <!-- Sink + faucet -->
    <rect x="745" y="360" width="44" height="76" rx="8" fill="#fff" stroke="#333"/>
    <rect x="750" y="366" width="34" height="64" rx="6" fill="none" stroke="#999"/>
    <circle cx="793" cy="398" r="3.5" fill="#222"/>
    <text x="725" y="402" class="small" text-anchor="end">Sink</text>

    <!-- Dishwasher -->
    <rect x="738" y="440" width="59" height="58" fill="none" stroke="#888" stroke-dasharray="3 3"/>
    <text x="767" y="473" class="small" text-anchor="middle">DW</text>

    <!-- Refrigerator (south end) -->
    <rect x="730" y="500" width="70" height="70" fill="#eef1f3" stroke="#333" stroke-width="1.5"/>
    <text x="765" y="539" class="small" text-anchor="middle">REF</text>

    <!-- Island 2.8 x 1.0 m, waterfall marble -->
    <rect x="520" y="210" width="100" height="280" fill="#f3f3f1" stroke="#333" stroke-width="1.5"/>
    <path d="M 535 230 q 25 40 10 90 t 30 110 M 590 220 q -15 60 15 120 t -20 130" fill="none" stroke="#c9c9c6" stroke-width="1"/>
    <line x1="520" y1="210" x2="620" y2="210" stroke="#333" stroke-width="4"/>
    <line x1="520" y1="490" x2="620" y2="490" stroke="#333" stroke-width="4"/>
    <!-- Pendants -->
    <circle cx="570" cy="300" r="18" fill="none" stroke="#7aa0b8" stroke-dasharray="4 3"/>
    <circle cx="570" cy="400" r="18" fill="none" stroke="#7aa0b8" stroke-dasharray="4 3"/>
    <text x="570" y="352" class="small" text-anchor="middle">ISLAND</text>
    <text x="570" y="365" class="small" text-anchor="middle">2.8 × 1.0</text>
    <!-- Rattan stools -->
    <g fill="#e8cfa2" stroke="#8a6a3d" stroke-width="1.25">
      <circle cx="498" cy="250" r="14"/>
      <circle cx="498" cy="317" r="14"/>
      <circle cx="498" cy="384" r="14"/>
      <circle cx="498" cy="451" r="14"/>
    </g>
    <text x="620" y="545" class="label" text-anchor="middle">KITCHEN</text>

    <!-- ===== WALLS ===== -->
    <path d="M 60 70 H 820 V 590 H 60 Z M 80 90 V 570 H 800 V 90 Z" fill="#2b2b2b" fill-rule="evenodd"/>

    <!-- Windows, north wall (living) -->
    <g>
      <rect x="140" y="70" width="200" height="20" fill="#fff"/>
      <line x1="140" y1="70" x2="340" y2="70" stroke="#2b2b2b" stroke-width="1"/>
      <line x1="140" y1="90" x2="340" y2="90" stroke="#2b2b2b" stroke-width="1"/>
      <line x1="140" y1="80" x2="340" y2="80" stroke="#4a6b80" stroke-width="2"/>
      <line x1="240" y1="70" x2="240" y2="90" stroke="#2b2b2b" stroke-width="2"/>
    </g>

    <!-- Steel-framed glass doors, north wall (kitchen) -->
    <g>
      <rect x="440" y="70" width="240" height="20" fill="#fff"/>
      <line x1="440" y1="70" x2="680" y2="70" stroke="#2b2b2b" stroke-width="1"/>
      <line x1="440" y1="90" x2="680" y2="90" stroke="#2b2b2b" stroke-width="1"/>
      <line x1="440" y1="80" x2="680" y2="80" stroke="#4a6b80" stroke-width="2"/>
      <line x1="500" y1="70" x2="500" y2="90" stroke="#111" stroke-width="2.5"/>
      <line x1="620" y1="70" x2="620" y2="90" stroke="#111" stroke-width="2.5"/>
      <!-- Centre French doors swinging out to garden -->
      <rect x="500" y="72" width="120" height="16" fill="#fff"/>
      <line x1="500" y1="70" x2="500" y2="10" stroke="#333" stroke-width="1.5"/>
      <line x1="620" y1="70" x2="620" y2="10" stroke="#333" stroke-width="1.5"/>
      <path d="M 500 10 A 60 60 0 0 1 560 70" fill="none" stroke="#999" stroke-dasharray="3 3"/>
      <path d="M 620 10 A 60 60 0 0 0 560 70" fill="none" stroke="#999" stroke-dasharray="3 3"/>
      <text x="560" y="0" class="small" text-anchor="middle">to garden</text>
    </g>

    <!-- Entry opening, south wall -->
    <rect x="400" y="568" width="90" height="24" fill="#fff"/>
    <line x1="400" y1="570" x2="400" y2="590" stroke="#2b2b2b" stroke-width="2"/>
    <line x1="490" y1="570" x2="490" y2="590" stroke="#2b2b2b" stroke-width="2"/>
    <text x="445" y="608" class="small" text-anchor="middle">ENTRY</text>

    <!-- ===== DIMENSIONS ===== -->
    <!-- Overall width (left of the garden doors' swing) -->
    <line x1="80" y1="40" x2="380" y2="40" class="dimline"/>
    <text x="230" y="34" class="dim" text-anchor="middle">3.00 (living)</text>
    <line x1="80" y1="62" x2="80" y2="30" class="ext"/>
    <line x1="380" y1="62" x2="380" y2="30" class="ext"/>
    <line x1="80" y1="640" x2="800" y2="640" class="dimline"/>
    <text x="440" y="656" class="dim" text-anchor="middle">7.20</text>
    <line x1="80" y1="596" x2="80" y2="648" class="ext"/>
    <line x1="800" y1="596" x2="800" y2="648" class="ext"/>
    <line x1="380" y1="620" x2="800" y2="620" class="dimline"/>
    <text x="680" y="614" class="dim" text-anchor="middle">4.20 (kitchen)</text>
    <line x1="380" y1="572" x2="380" y2="626" class="ext"/>
    <!-- Overall depth -->
    <line x1="860" y1="90" x2="860" y2="570" class="dimline"/>
    <text x="874" y="330" class="dim" transform="rotate(90 874 330)" text-anchor="middle">4.80</text>
    <line x1="824" y1="90" x2="868" y2="90" class="ext"/>
    <line x1="824" y1="570" x2="868" y2="570" class="ext"/>
    <!-- Work aisle island ↔ counter -->
    <line x1="620" y1="180" x2="735" y2="180" class="dimline"/>
    <text x="677" y="174" class="dim" text-anchor="middle">1.15</text>
    <!-- Seating clearance behind stools -->
    <line x1="380" y1="520" x2="520" y2="520" class="dimline"/>
    <text x="450" y="514" class="dim" text-anchor="middle">1.40</text>

    <!-- North arrow -->
    <g transform="translate(900,40)">
      <circle r="16" fill="none" stroke="#555"/>
      <path d="M 0 -13 L 6 8 L 0 3 L -6 8 Z" fill="#333"/>
      <text y="-20" class="small" text-anchor="middle">N</text>
    </g>

    <!-- Scale bar -->
    <g transform="translate(80,668)">
      <rect x="0" y="0" width="100" height="6" fill="#333"/>
      <rect x="100" y="0" width="100" height="6" fill="#fff" stroke="#333"/>
      <text x="0" y="20" class="small" text-anchor="middle">0</text>
      <text x="100" y="20" class="small" text-anchor="middle">1</text>
      <text x="200" y="20" class="small" text-anchor="middle">2 m</text>
    </g>
  </g>
</svg>
